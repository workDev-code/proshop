<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="220" y="80" width="160" height="440" rx="30" fill="url(#phone)" stroke="#4b5563" stroke-width="2"/>
  <!-- Screen -->
  <rect x="232" y="92" width="136" height="416" rx="22" fill="#000"/>
  <!-- Notch -->
  <rect x="270" y="100" width="60" height="20" rx="10" fill="#0a0a1a"/>
  <!-- Screen content - camera module shape -->
  <rect x="260" y="170" width="80" height="80" rx="14" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <circle cx="285" cy="195" r="14" fill="#0a0a1a" stroke="#6b7280" stroke-width="2"/>
  <circle cx="315" cy="195" r="14" fill="#0a0a1a" stroke="#6b7280" stroke-width="2"/>
  <circle cx="285" cy="225" r="14" fill="#0a0a1a" stroke="#6b7280" stroke-width="2"/>
  <circle cx="312" cy="225" r="6" fill="#fbbf24"/>
  <!-- Status bar text -->
  <text x="300" y="380" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#f3f4f6">iPhone</text>
  <text x="300" y="410" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#9ca3af">13 Pro · 256GB</text>
  <!-- Brand -->
  <text x="300" y="560" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#6b7280" letter-spacing="3">APPLE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a1f"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="echo" cx="0.5" cy="0.4">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- Echo Dot sphere -->
  <circle cx="300" cy="260" r="140" fill="url(#echo)" stroke="#4f46e5" stroke-width="2"/>
  <!-- Top highlight -->
  <ellipse cx="270" cy="200" rx="50" ry="30" fill="#ffffff" opacity="0.3"/>
  <!-- Light ring -->
  <ellipse cx="300" cy="140" rx="100" ry="15" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>
  <ellipse cx="300" cy="140" rx="100" ry="15" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.5"/>
  <!-- Speaker mesh dots -->
  <g opacity="0.4" fill="#312e81">
    <circle cx="260" cy="260" r="2"/><circle cx="280" cy="270" r="2"/><circle cx="300" cy="275" r="2"/><circle cx="320" cy="270" r="2"/><circle cx="340" cy="260" r="2"/>
    <circle cx="265" cy="290" r="2"/><circle cx="285" cy="300" r="2"/><circle cx="305" cy="305" r="2"/><circle cx="325" cy="300" r="2"/><circle cx="345" cy="290" r="2"/>
    <circle cx="270" cy="320" r="2"/><circle cx="290" cy="330" r="2"/><circle cx="310" cy="333" r="2"/><circle cx="330" cy="330" r="2"/><circle cx="350" cy="320" r="2"/>
  </g>
  <!-- Sound waves -->
  <g opacity="0.5" stroke="#06b6d4" fill="none" stroke-width="2">
    <path d="M 180 200 Q 165 260 180 320"/>
    <path d="M 140 170 Q 110 260 140 350"/>
  </g>
  <g opacity="0.5" stroke="#06b6d4" fill="none" stroke-width="2">
    <path d="M 420 200 Q 435 260 420 320"/>
    <path d="M 460 170 Q 490 260 460 350"/>
  </g>
  <text x="300" y="450" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#e0e7ff" letter-spacing="3">ECHO DOT</text>
  <text x="300" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#a5b4fc">3rd Generation</text>
  <text x="300" y="555" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#00a8e1" letter-spacing="3">AMAZON</text>
</svg>

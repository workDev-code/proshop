<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ps5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- PS5 vertical console -->
  <g transform="translate(240, 100)">
    <!-- Outer shell -->
    <path d="M 0 0 Q 0 -20 30 -20 L 90 -20 Q 120 -20 120 0 L 120 380 Q 120 400 90 400 L 30 400 Q 0 400 0 380 Z" fill="url(#ps5)" stroke="#64748b" stroke-width="2"/>
    <!-- Center black plate -->
    <rect x="15" y="20" width="90" height="360" rx="4" fill="#0a0a1a"/>
    <!-- Blue light strip -->
    <rect x="45" y="30" width="30" height="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="45" y="367" width="30" height="3" fill="#3b82f6" opacity="0.8"/>
    <!-- PS logo -->
    <text x="60" y="220" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#3b82f6" opacity="0.7">PS5</text>
  </g>
  <!-- Controller hint -->
  <g transform="translate(200, 470)" opacity="0.5">
    <ellipse cx="100" cy="20" rx="80" ry="20" fill="#1e293b"/>
    <circle cx="60" cy="20" r="8" fill="#0a0a1a"/>
    <circle cx="140" cy="20" r="8" fill="#0a0a1a"/>
  </g>
  <text x="300" y="555" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" letter-spacing="3">SONY</text>
</svg>
